name: Actualizar índice de resúmenes
on:
  push:
    branches: [main]
    paths: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/build-index.mjs
      - name: Guardar index.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || (git commit -m "Actualizar index.json [skip ci]" && git push)
