<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0F14">
<title>Resúmenes · Teleco</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --bg:#0B0F14; --panel:#121923; --panel2:#182230; --line:#30363d;
  --text:#E6EDF3; --muted:#98A6B7; --accent:#79B8FF; --c:#79B8FF;
  --radius:12px; --side:290px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}

/* Barra superior */
.top{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:14px;
  padding:0 18px;background:rgba(11,15,20,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:18px;color:var(--text);white-space:nowrap}
.brand:hover{text-decoration:none}
.search{flex:1;max-width:520px;margin:0 auto 0 12px}
.search input{width:100%;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font:inherit;font-size:15px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(121,184,255,.2)}
.gh{font-size:14px;color:var(--muted);white-space:nowrap}
#menuBtn{display:block;flex:none;background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;cursor:pointer;font-size:18px}

/* Estructura */
.layout{display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100vh - 60px)}
#side{position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow:auto;
  padding:14px 12px 40px;border-right:1px solid var(--line);background:var(--bg)}
#main{min-width:0;padding:32px clamp(16px,4vw,48px) 80px}
#scrim{display:none}
body.noside .layout{grid-template-columns:1fr}
body.noside #side{display:none}

/* Barra lateral */
#side details{margin-bottom:6px;border-radius:10px}
#side summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;
  border-radius:10px;user-select:none}
#side summary::-webkit-details-marker{display:none}
#side summary:hover{background:var(--panel)}
#side summary b{color:var(--c);font-size:15px;letter-spacing:.3px;min-width:34px}
#side summary span{color:var(--muted);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side summary em{font-style:normal;font-size:12px;color:var(--muted);background:var(--panel);
  padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
#side summary::after{content:"›";color:var(--muted);transition:transform .15s;margin-left:2px}
#side details[open] summary::after{transform:rotate(90deg)}
#side ul{list-style:none;margin:2px 0 8px 14px;padding:0 0 0 10px;border-left:1px solid var(--line)}
#side li a{display:block;padding:5px 10px;border-radius:8px;color:#c9d1d9;font-size:14px;line-height:1.35}
#side li a:hover{background:var(--panel);text-decoration:none}
#side li a.on{background:color-mix(in srgb,var(--c) 18%,transparent);color:#fff}
.grp{margin:10px 0 2px 24px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600}

/* Portada */
.hero h1{margin:0 0 6px;font-size:clamp(28px,4vw,40px);letter-spacing:-.5px}
.hero p{margin:0 0 28px;color:var(--muted);max-width:620px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:var(--radius);
  background:var(--panel);border:1px solid var(--line);color:var(--text);position:relative;overflow:hidden;
  transition:transform .15s,border-color .15s,background .15s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.card:hover{transform:translateY(-2px);border-color:var(--c);background:var(--panel2);text-decoration:none}
.card .code{font-size:30px;font-weight:800;color:var(--c);letter-spacing:.5px;line-height:1.1}
.card .nm{color:var(--muted);font-size:14px;min-height:21px}
.card .n{margin-top:6px;font-size:13px;color:var(--muted)}
.card ul{list-style:none;margin:8px 0 0;padding:0;font-size:13px;color:#b6c0cb}
.card li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0}
.card li::before{content:"· ";color:var(--c)}

/* Listas */
.crumbs{font-size:14px;color:var(--muted);margin-bottom:14px}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--text)}
.head h1{margin:0 0 4px;font-size:clamp(26px,3.5vw,34px);color:var(--text)}
.head h1 i{font-style:normal;color:var(--c)}
.head p{margin:0 0 20px;color:var(--muted)}
.list h3{margin:22px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.list ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);color:var(--text)}
.list li a:hover{border-color:var(--c);text-decoration:none;background:var(--panel2)}
.list li a small{margin-left:auto;color:var(--muted);font-size:12px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;
  color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}

/* Visor */
.page{display:grid;grid-template-columns:minmax(0,820px) 220px;gap:40px;justify-content:center}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:13px;
  background:var(--panel);border:1px solid var(--line);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--accent);text-decoration:none}
.toc{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 110px);overflow:auto;font-size:13px}
.toc b{display:block;margin-bottom:8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.toc a{display:block;padding:3px 0 3px 10px;color:var(--muted);border-left:2px solid var(--line);line-height:1.35}
.toc a:hover{color:var(--text);text-decoration:none;border-color:var(--c)}
.toc a.l3{padding-left:22px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.pn a{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);min-width:0}
.pn a:hover{border-color:var(--c);text-decoration:none}
.pn small{display:block;color:var(--muted);font-size:12px}
.pn span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn .nx{text-align:right;grid-column:2}

/* Markdown */
.md{overflow-wrap:anywhere;font-size:var(--fs,16px)}
.md>:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4{line-height:1.25;margin:1.8em 0 .6em;scroll-margin-top:76px}
.md h1{font-size:2em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
.md h2{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
.md h3{font-size:1.2em}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md table{margin:0 0 1em}
.md ul,.md ol{padding-left:1.6em}
.md li+li{margin-top:.25em}
.md code{font:.88em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:rgba(110,118,129,.25);
  padding:.15em .4em;border-radius:6px}
.md pre{background:#070a0e;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;line-height:1.5}
.md pre code{background:none;padding:0;font-size:.88em}
.md blockquote{margin-left:0;padding:.4em 1em;color:#b6c0cb;border-left:4px solid var(--c);background:var(--panel);border-radius:0 8px 8px 0}
.md img{max-width:100%;height:auto;border-radius:8px}
.md hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.tw{overflow-x:auto;margin:0 0 1em}
.tw table{border-collapse:collapse;width:max-content;min-width:100%;margin:0}
.md th,.md td{border:1px solid var(--line);padding:8px 14px;text-align:left}
.md th{background:var(--panel);font-weight:600}
.md tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.md input[type=checkbox]{margin-right:.5em}
.md .katex-display{overflow-x:auto;overflow-y:hidden;padding:8px 0;margin:1em 0}
.md mark{background:#bb800966;color:inherit;padding:0 2px;border-radius:3px}

.loading{color:var(--muted);padding:40px 0}
.err{padding:16px 18px;border:1px solid #6e2b2b;background:#2a1517;border-radius:10px;color:#ffb4b4;margin-bottom:24px}
footer{margin-top:60px;color:var(--muted);font-size:13px}

@media (max-width:1180px){.page{grid-template-columns:minmax(0,820px)}.toc{display:none}}
@media (max-width:860px){
  .layout{display:block}
  body.noside #side{display:block}
  #side{position:fixed;z-index:40;top:60px;left:0;bottom:0;width:min(86vw,320px);height:auto;
    transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.6)}
  body.open #side{transform:none}
  body.open #scrim{display:block;position:fixed;inset:60px 0 0 0;background:rgba(0,0,0,.5);z-index:35}
  .gh{display:none}
  .search{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

#prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:60;transition:width .1s}
.meta{margin-left:auto;align-self:center;color:var(--muted);font-size:13px}
.resume{display:flex;flex-direction:column;gap:2px;margin:0 0 20px;padding:14px 18px;border-radius:var(--radius);
  background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);color:var(--text);max-width:520px}
.resume:hover{background:var(--panel2);text-decoration:none}
.resume small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.resume b{color:var(--c)}
.list li a.res{flex-direction:column;align-items:stretch;gap:6px}
.rt{display:flex;align-items:center;gap:10px}
.sn{color:var(--muted);font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.sn mark{background:#bb800966;color:var(--text);border-radius:3px;padding:0 2px}
.pw{position:relative;margin:0 0 1em}
.pw pre{margin:0}
.cp{position:absolute;top:8px;right:8px;padding:3px 10px;font-size:12px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);cursor:pointer;opacity:0;transition:opacity .15s}
.pw:hover .cp,.cp:focus-visible{opacity:1}
.cp:hover{color:var(--text);border-color:var(--accent)}
@media (hover:none){.cp{opacity:1}}

@media print{
  :root{--bg:#fff;--panel:#f6f8fa;--line:#d0d7de;--text:#1f2328;--muted:#57606a;--accent:#0969da}
  body{background:#fff;color:#1f2328}
  .top,#side,#scrim,#prog,.toc,.actions,.pn,.cp,footer,.crumbs{display:none!important}
  .layout,.page{display:block}
  #main{padding:0}
  .md{font-size:12pt}
  .md pre,.md pre code,.md pre code *{color:#1f2328!important;background:#f6f8fa!important;white-space:pre-wrap}
  .md code{background:#eff1f3}
  .md blockquote{color:#333}
  .md h1,.md h2,.md h3{break-after:avoid}
  .md pre,.md table,.md img{break-inside:avoid}
  .tw{overflow:visible}
}

#up{position:fixed;right:18px;bottom:18px;z-index:45;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:18px;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity .2s,transform .2s;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#up.show{opacity:1;pointer-events:auto;transform:none}
#up:hover{border-color:var(--accent)}
.toc a.act{color:var(--text);border-color:var(--c);font-weight:600}
.md blockquote.callout{border-left-color:var(--k);background:color-mix(in srgb,var(--k) 10%,transparent)}
.md blockquote.callout .ct{font-weight:700;color:var(--k);margin:.3em 0 .1em}
.callout.note{--k:#79B8FF}.callout.tip{--k:#3fb950}.callout.important{--k:#a371f7}.callout.warning{--k:#d29922}.callout.caution{--k:#f85149}
.mm{overflow-x:auto;margin:0 0 1em;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.mermaid{white-space:pre;text-align:left;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted)}
.mermaid[data-processed]{text-align:center;white-space:normal;color:inherit}
.mermaid svg{max-width:100%;height:auto}
@media print{#up{display:none!important}.mm{background:#fff;break-inside:avoid}}
</style>
</head>
<body>
<div id="prog"></div>
<button id="up" type="button" aria-label="Volver arriba" title="Volver arriba">↑</button>
<header class="top">
  <button id="menuBtn" aria-label="Abrir menú">☰</button>
  <a class="brand" href="#/">📚 <span id="siteTitle">Resúmenes</span></a>
  <div class="search"><input id="q" type="search" placeholder="Buscar resumen o concepto…  ( / )" autocomplete="off" aria-label="Buscar resumen"></div>
  <a class="gh" id="ghTop" target="_blank" rel="noopener">GitHub ↗</a>
</header>
<div class="layout">
  <nav id="side" aria-label="Asignaturas"></nav>
  <div id="scrim"></div>
  <main id="main"><div class="loading">Cargando resúmenes…</div></main>
</div>

<script>
/* ============ CONFIGURACIÓN ============ */
const CFG = {
  owner: 'AlvGJ-UGR',
  repo: 'Resumenes-Varios-',
  branch: 'main',
  titulo: 'Resúmenes · Teleco',
  orden: ['CCE', 'SD', 'ST', 'TC', 'TO'],
  nombres: { CCE: 'Componentes y Circuitos', SD: 'Señales Digitales', ST: 'Sistemas Telemáticos', TC: 'Teoría de la Comunicación', TO: 'Transmisión de Ondas' }
};
/* ======================================= */

const COLORS = ['#79B8FF','#3fb950','#d29922','#f778ba','#a371f7','#ff7b72','#39c5cf'];
const \$ = s => document.querySelector(s);
const main = \$('#main'), side = $('#side'), q = $('#q');
const state = { subjects: [], byPath: new Map(), bySubj: new Map(), offline: false };

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const REPO = `https://github.com/${CFG.owner}/${CFG.repo}`;
const rawUrl = p => `https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/${CFG.branch}/${encPath(p)}`;
const ghUrl = p => `${REPO}/blob/${CFG.branch}/${encPath(p)}`;
const folderUrl = k => `${REPO}/tree/${CFG.branch}/${encodeURIComponent(k)}`;
const href = p => '#/' + encPath(p);
const prettify = f => f.replace(/\.(md|markdown)\$/i, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim();
const cmp = (a, b) => a.localeCompare(b, 'es', { numeric: true, sensitivity: 'base' });

/* ---------- Datos (con respaldo jsDelivr exactamente como el original que funcionaba) ---------- */
async function fetchTree() {
  try {
    const r = await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/git/trees/${CFG.branch}?recursive=1`,
      { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    return j.tree.filter(x => x.type === 'blob').map(x => x.path);
  } catch (e) {
    const r = await fetch(`https://data.jsdelivr.com/v1/package/gh/${CFG.owner}/${CFG.repo}@${CFG.branch}/flat`);
    if (!r.ok) throw e;
    const j = await r.json();
    return j.files.map(f => f.name.replace(/^\//, ''));
  }
}

async function loadTree() {
  const key = 'rv-tree-v2', ttl = 3 * 60e3;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(key)); } catch {}
  if (cached && Date.now() - cached.t < ttl) return cached.tree;
  try {
    const tree = await fetchTree();
    try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), tree })); } catch {}
    return tree;
  } catch (e) {
    if (cached) return cached.tree;
    throw e;
  }
}

function build(paths) {
  const map = new Map();
  for (const p of paths) {
    if (!/\.(md|markdown)\$/i.test(p)) continue;
    const parts = p.split('/');
    if (parts.length < 2 || parts[0].startsWith('.')) continue;
    const key = parts[0], name = parts[parts.length - 1];
    if (!map.has(key)) map.set(key, []);
    map.get(key).push({ path: p, subj: key, sub: parts.slice(1, -1).join(' / '), name, title: prettify(name) });
  }
  const keys = [...new Set([...CFG.orden, ...map.keys()])].filter(k => map.has(k) || CFG.orden.includes(k));
  setSubjects(keys.map(k => ({ key: k, files: (map.get(k) || []).sort((a, b) => cmp(a.sub, b.sub) || cmp(a.name, b.name)) })));
}

function setSubjects(list) {
  state.subjects = list.map((s, i) => ({ ...s, name: CFG.nombres[s.key] || '', color: COLORS[i % COLORS.length] }));
  state.byPath.clear(); state.bySubj.clear();
  for (const s of state.subjects) {
    state.bySubj.set(s.key, s);
    for (const f of s.files) { f.s = s; state.byPath.set(f.path, f); }
  }
}

/* ---------- Vistas ---------- */
function groupsHtml(files, compact) {
  const m = new Map();
  for (const f of files) { if (!m.has(f.sub)) m.set(f.sub, []); m.get(f.sub).push(f); }
  let h = '';
  for (const [sub, fs] of m) {
    if (sub) h += `<h3 class="${compact ? 'grp' : ''}">${esc(sub)}</h3>`;
    h += '<ul>' + fs.map(f => `<li><a href="${href(f.path)}" data-path="${esc(f.path)}">${esc(f.title)}</a></li>`).join('') + '</ul>';
  }
  return h;
}

function renderSide() {
  side.innerHTML = state.subjects.map(s => `
    <details data-s="${esc(s.key)}" style="--c:${s.color}">
      <summary><b>${esc(s.key)}</b><span>${esc(s.name)}</span><em>${s.files.length}</em></summary>
      ${s.files.length ? groupsHtml(s.files, true) : ''}
    </details>`).join('');
}

function setActive(path, subj) {
  side.querySelectorAll('a.on').forEach(a => a.classList.remove('on'));
  if (subj) { const d = side.querySelector(`details[data-s="${CSS.escape(subj)}"]`); if (d) d.open = true; }
  if (path) {
    const a = [...side.querySelectorAll('a[data-path]')].find(x => x.dataset.path === path);
    if (a) {
      a.classList.add('on'); a.style.setProperty('--c', state.byPath.get(path).s.color);
      const top = a.offsetTop;
      if (top < side.scrollTop + 40 || top > side.scrollTop + side.clientHeight - 60) side.scrollTop = Math.max(0, top - side.clientHeight / 3);
    }
  }
}

function home() {
  document.title = CFG.titulo;
  const total = state.subjects.reduce((n, s) => n + s.files.length, 0);
  const cards = state.subjects.map(s => {
    const link = state.offline ? folderUrl(s.key) : '#/' + encodeURIComponent(s.key);
    const ext = state.offline ? ' target="_blank" rel="noopener"' : '';
    return `<a class="card" href="${link}"${ext} style="--c:${s.color}">
      <span class="code">${esc(s.key)}</span>
      <span class="nm">${esc(s.name) || '&nbsp;'}</span>
      <span class="n">${state.offline ? 'Abrir carpeta en GitHub ↗' : s.files.length + (s.files.length === 1 ? ' resumen' : ' resúmenes')}</span>
      ${s.files.length ? '<ul>' + s.files.slice(0, 3).map(f => `<li>\${esc(f.title)}</li>`).join('') + '</ul>' : ''}
    </a>`;
  }).join('');
  let resume = '';
  try {
    const lf = state.byPath.get(localStorage.getItem('rv-last'));
    if (lf) resume = `<a class="resume" href="${href(lf.path)}" style="--c:${lf.s.color}"><small>Continuar donde lo dejaste</small><span><b>${esc(lf.subj)}</b> · ${esc(lf.title)}</span></a>`;
  } catch {}
  main.innerHTML = `
    <section class="hero">
      <h1>${esc(CFG.titulo)}</h1>
      <p>${state.offline ? 'No se ha podido leer el índice desde GitHub; usa los enlaces a las carpetas.' :
        `\${total} resúmenes organizados en \${state.subjects.length} asignaturas de Ingeniería de Telecomunicación.`}</p>
    </section>
    ${resume}
    <div class="cards">${cards}</div>
    <footer>Centro de estudio personal · Sincronizado con <a href="${REPO}" target="_blank" rel="noopener">GitHub</a> · <a href="#/" id="refresh">Actualizar lista</a></footer>`;
  const rf = \$('#refresh');
  if (rf) rf.onclick = e => { e.preventDefault(); try { localStorage.removeItem('rv-tree-v2'); } catch {} location.reload(); };
  setActive(null, null);
  window.scrollTo(0, 0);
}

function subjectView(s) {
  document.title = `${s.key} · ${CFG.titulo}`;
  main.innerHTML = `
    <div class="crumbs"><a href="#/">Inicio</a> / ${esc(s.key)}</div>

      <p>${s.files.length} ${s.files.length === 1 ? 'resumen' : 'resúmenes'} · <a href="${folderUrl(s.key)}" target="_blank" rel="noopener">ver carpeta en GitHub ↗</a></p></div>
    <div class="list" style="--c:${s.color}">${s.files.length ? groupsHtml(s.files, false) : '<div class="empty">Esta carpeta aún no tiene resúmenes en Markdown.</div>'}</div>`;
  setActive(null, s.key);

let searchSeq = 0, idx = null;
function ensureIndex() {
  if (idx) return idx.promise;
  const files = state.subjects.flatMap(s => s.files);
  idx = { ready: false };
  let i = 0;
  const worker = async () => {
    while (i < files.length) {
      const f = files[i++];
      if (f.text == null) {
        try { const r = await fetch(rawUrl(f.path)); if (r.ok) f.text = await r.text(); } catch {}
      }
      if (f.text != null && f.ntext == null) {
        const t = f.text;
        let nt = '', map = [];
        for (let j = 0; j < t.length; j++) {
          const normChar = t[j].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
          for (let k = 0; k < normChar.length; k++) { nt += normChar[k]; map.push(j); }
        }
        f.ntext = nt; f.imap = map;
      }
    }
  };
  idx.promise = Promise.all(Array.from({ length: 6 }, worker)).then(() => { idx.ready = true; });
  return idx.promise;
}

function snippet(f, terms) {
  const nt = f.ntext, t = f.text, map = f.imap;
  if (!nt || !map) return '';
  let pos = -1;
  for (const w of terms) { const k = nt.indexOf(w); if (k >= 0 && (pos < 0 || k < pos)) pos = k; }
  if (pos < 0) return '';
  const origPos = map[pos];
  const a = Math.max(0, origPos - 50), b = Math.min(t.length, origPos + 130);
  const o = t.slice(a, b), marks = [];
  for (const w of terms) {
    let k = nt.indexOf(w);
    while (k >= 0) {
      const startOrig = map[k], endOrig = map[Math.min(k + w.length - 1, map.length - 1)] + 1;
      if (endOrig > a && startOrig < b) {
        marks.push([Math.max(0, startOrig - a), Math.min(t.length - a, endOrig - a)]);
      }
      k = nt.indexOf(w, k + w.length);
    }
  }
  marks.sort((x, y) => x[0] - y[0]);
  let out = '', last = 0;
  for (const [x, y] of marks) {
    if (x < last || x >= o.length) continue;
    const validY = Math.min(y, o.length);
    out += esc(o.slice(last, x)) + '<mark>' + esc(o.slice(x, validY)) + '</mark>';
    last = validY;
  }
  out += esc(o.slice(last));
  return (a > 0 ? '… ' : '') + out.replace(/\s+/g, ' ') + (b < t.length ? ' …' : '');
}

function searchView(text) {
  const seq = ++searchSeq;
  const terms = norm(text).split(/\s+/).filter(Boolean);
  const byTitle = [];
  for (const s of state.subjects) for (const f of s.files) {
    const hay = norm(`${s.key} ${s.name} ${f.sub} ${f.title}`);
    if (terms.every(t => hay.includes(t))) byTitle.push(f);
  }
  const item = (f, sn) => `<li><a class="res" href="${href(f.path)}" style="--c:${f.s.color}">
      <span class="rt"><span class="badge">${esc(f.subj)}</span>${esc(f.title)}${f.sub ? `<small>\${esc(f.sub)}</small>` : ''}</span>
      ${sn ? `<span class="sn">\${sn}</span>` : ''}</a></li>`;
  const draw = () => {
    if (seq !== searchSeq) return;
    const inTitle = new Set(byTitle), byText = [];
    for (const s of state.subjects) for (const f of s.files)
      if (!inTitle.has(f) && f.ntext && terms.every(t => f.ntext.includes(t))) byText.push(f);
    const total = byTitle.length + byText.length, pending = idx && !idx.ready;
    main.innerHTML = `
      <div class="head"><h1>Resultados</h1><p>${total} ${total === 1 ? 'resultado' : 'resultados'} para «${esc(text)}»${pending ? ' · buscando también dentro de los resúmenes…' : ''}</p></div>
      <div class="list">
        ${byTitle.length ? `<h3>Por título</h3><ul>\${byTitle.map(f => item(f, '')).join('')}</ul>` : ''}
        ${byText.length ? `<h3>Dentro del texto</h3><ul>\${byText.map(f => item(f, snippet(f, terms))).join('')}</ul>` : ''}
        ${total || pending ? '' : '<div class="empty">Sin coincidencias. Prueba con otra palabra o fórmula.</div>'}
      </div>`;
    main.querySelectorAll('a.res').forEach(a => a.addEventListener('click', () => {
      try { sessionStorage.setItem('rv-hl', JSON.stringify(terms.filter(t => t.length > 1))); } catch {}
    }));
  };
  const p = terms.join('').length >= 2 ? ensureIndex() : null;
  draw();
  if (p && !idx.ready) p.then(draw);
}

/* ---------- Markdown ---------- */
function renderMd(src) {
  const code = [], math = [];
  src = src.replace(/(```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]+`)/g, m => `RVCODE${code.push(m) - 1}X`);
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => `RVMATH${math.push({ t, d: true }) - 1}X`);
  src = src.replace(/(?<![\\$])\$(?!\s)([^\$\n]+?)(?<!\s)\$(?!\d)/g, (_, t) => `RVMATH${math.push({ t, d: false }) - 1}X`);
  src = src.replace(/RVCODE(\d+)X/g, (_, i) => code[i]);
  let html = DOMPurify.sanitize(marked.parse(src, { gfm: true }));
  html = html.replace(/RVMATH(\d+)X/g, (_, i) => {
    const m = math[i];
    try { return window.katex ? katex.renderToString(m.t.trim(), { displayMode: m.d, throwOnError: false }) : esc(m.t); }
    catch { return esc(m.t); }
  });
  return html;
}

async function fileView(f) {
  document.title = `${f.title} · ${CFG.titulo}`;
  const list = f.s.files, i = list.indexOf(f);
  main.innerHTML = `<div class="loading">Cargando «${esc(f.title)}»…</div>`;
  setActive(f.path, f.subj);
  window.scrollTo(0, 0);
  let text = f.text;
  if (text == null) try {
    const r = await fetch(rawUrl(f.path));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    text = await r.text();
    f.text = text;
    let nt = '', map = [];
    for (let j = 0; j < text.length; j++) {
      const normChar = text[j].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      for (let k = 0; k < normChar.length; k++) { nt += normChar[k]; map.push(j); }
    }
    f.ntext = nt; f.imap = map;
  } catch (e) {
    main.innerHTML = `<div class="err">No se pudo cargar el resumen (${esc(e.message)}). <a href="${ghUrl(f.path)}" target="_blank" rel="noopener">Ábrelo en GitHub ↗</a></div>`;
    return;
  }
  if (location.hash !== href(f.path) && decodeURIComponent(location.hash.slice(2)) !== f.path) return;
  const prev = list[i - 1], next = list[i + 1];
  const mins = Math.max(1, Math.round(text.split(/\s+/).length / 200));
  main.innerHTML = `
    <div class="page" style="--c:${f.s.color}">
      <article>
        <div class="crumbs"><a href="#/">Inicio</a> / <a href="#/${encodeURIComponent(f.subj)}">${esc(f.subj)}</a>${f.sub ? ' / ' + esc(f.sub) : ''}</div>
        <div class="actions">
          <a class="btn" href="${ghUrl(f.path)}" target="_blank" rel="noopener">Ver en GitHub ↗</a>
          <a class="btn" href="${rawUrl(f.path)}" target="_blank" rel="noopener">Archivo .md</a>
          <button class="btn" id="copyBtn">Copiar enlace</button>
          <button class="btn" id="printBtn">Imprimir / PDF</button>
          <button class="btn" id="fsm" title="Texto más pequeño" aria-label="Texto más pequeño">A−</button>
          <button class="btn" id="fsp" title="Texto más grande" aria-label="Texto más grande">A+</button>
          <span class="meta">${mins} min de lectura</span>
        </div>
        <div class="md" id="md"></div>
        <nav class="pn">
          ${prev ? `<a href="${href(prev.path)}"><small>← Anterior</small><span>${esc(prev.title)}</span></a>` : '<span></span>'}
          ${next ? `<a class="nx" href="${href(next.path)}"><small>Siguiente →</small><span>${esc(next.title)}</span></a>` : ''}
        </nav>
      </article>
      <aside class="toc" id="toc"></aside>
    </div>`;
  const md = \$('#md');
  md.innerHTML = renderMd(text);
  fixContent(md, f);
  buildToc(md);
  let hl = null;
  try { hl = JSON.parse(sessionStorage.getItem('rv-hl')); sessionStorage.removeItem('rv-hl'); } catch {}
  const first = hl && hl.length ? highlight(md, hl) : null;
  if (first) {
    first.scrollIntoView({ block: 'center', behavior: 'instant' });
    const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'Quitar resaltado';
    b.onclick = () => { md.querySelectorAll('mark.hl').forEach(m => m.replaceWith(m.textContent)); md.normalize(); b.remove(); };
    const bar = \$('.actions'); bar.insertBefore(b, bar.querySelector('.meta'));
  } else {
    let y = 0;
    try { y = JSON.parse(localStorage.getItem('rv-pos') || '{}')[f.path] || 0; } catch {}
    if (y > 0) scrollTo({ top: y, behavior: 'instant' });
  }
  state.cur = f.path;
  \$('#copyBtn').onclick = async e => {
    try { await navigator.clipboard.writeText(location.href); e.target.textContent = '¡Copiado!'; }
    catch { e.target.textContent = 'No se pudo copiar'; }
    setTimeout(() => e.target.textContent = 'Copiar enlace', 1600);
  };
  \$('#printBtn').onclick = () => window.print();
  \$('#fsm').onclick = () => setFs(fs - 1);
  \$('#fsp').onclick = () => setFs(fs + 1);
  try { localStorage.setItem('rv-last', f.path); } catch {}
  updateProgress();
}

let mermaidP = null;
function renderMermaid(nodes) {
  mermaidP = mermaidP || new Promise((res, rej) => {
    if (window.mermaid) return res(window.mermaid);
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js';
    sc.onload = () => res(window.mermaid);
    sc.onerror = () => { mermaidP = null; rej(new Error('mermaid')); };
    document.head.append(sc);
  });
  mermaidP.then(m => { m.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict' }); return m.run({ nodes }); })
    .catch(() => {});
}

function highlight(root, terms) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest('.katex,.mermaid,script,style') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  let first = null;
  for (const n of nodes) {
    const t = n.nodeValue, nt = norm(t);
    if (nt.length !== t.length) continue;
    const ranges = [];
    for (const w of terms) { let k = nt.indexOf(w); while (k >= 0) { ranges.push([k, k + w.length]); k = nt.indexOf(w, k + w.length); } }
    if (!ranges.length) continue;
    ranges.sort((a, b) => a[0] - b[0]);
    const frag = document.createDocumentFragment(); let last = 0;
    for (const [a, b] of ranges) {
      if (a < last) continue;
      frag.append(t.slice(last, a));
      const m = document.createElement('mark'); m.className = 'hl'; m.textContent = t.slice(a, b); frag.append(m);
      if (!first) first = m;
      last = b;
    }
    frag.append(t.slice(last)); n.replaceWith(frag);
  }
  return first;
}

function fixContent(md, f) {
  const base = 'https://h/' + encPath(f.path);
  const CALL = { note: 'Nota', tip: 'Consejo', important: 'Importante', warning: 'Aviso', caution: 'Precaución' };
  md.querySelectorAll('blockquote').forEach(bq => {
    const p = bq.firstElementChild;
    if (!p || p.tagName !== 'P') return;
    const m = p.innerHTML.match(/^\s*\[!(NOTE\vert{}TIP\vert{}IMPORTANT\vert{}WARNING\vert{}CAUTION)\]\s*(?:<br\s*\/?>)?\s*/i);
    if (!m) return;
    const k = m[1].toLowerCase();
    p.innerHTML = p.innerHTML.slice(m[0].length);
    if (!p.textContent.trim() && !p.children.length) p.remove();
    bq.classList.add('callout', k);
    const t = document.createElement('div'); t.className = 'ct'; t.textContent = CALL[k];
    bq.prepend(t);
  });
  const mm = [];
  md.querySelectorAll('pre > code.language-mermaid').forEach(code => {
    const box = document.createElement('div'); box.className = 'mm';
    const d = document.createElement('div'); d.className = 'mermaid'; d.textContent = code.textContent;
    box.append(d); code.parentElement.replaceWith(box); mm.push(d);
  });
  if (mm.length) renderMermaid(mm);
  md.querySelectorAll('img').forEach(img => {
    const s = img.getAttribute('src') || '';
    if (!/^(https?:|data:)/i.test(s)) {
      const u = new URL(s, base);
      img.src = rawUrl(decodeURIComponent(u.pathname.slice(1)));
    }
    img.loading = 'lazy';
  });
  md.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (h.startsWith('#')) {
      a.addEventListener('click', e => { e.preventDefault(); const t = document.getElementById(decodeURIComponent(h.slice(1))); if (t) t.scrollIntoView(); });
    } else if (/^(https?:|mailto:)/i.test(h)) {
      a.target = '_blank'; a.rel = 'noopener noreferrer';
    } else {
      const u = new URL(h, base), p = decodeURIComponent(u.pathname.slice(1));
      if (state.byPath.has(p)) a.href = href(p);
      else { a.href = ghUrl(p); a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    }
  });
  md.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tw'; t.replaceWith(w); w.append(t); });
  if (window.hljs) md.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  md.querySelectorAll('pre').forEach(pre => {
    const w = document.createElement('div'); w.className = 'pw';
    pre.replaceWith(w); w.append(pre);
    const b = document.createElement('button'); b.className = 'cp'; b.type = 'button'; b.textContent = 'Copiar';
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(pre.innerText.replace(/\n\$/, '')); b.textContent = '¡Copiado!'; }
      catch { b.textContent = 'Error'; }
      setTimeout(() => b.textContent = 'Copiar', 1400);
    };
    w.append(b);
  });
}

function buildToc(md) {
  const used = new Set();
  const hs = [...md.querySelectorAll('h1,h2,h3,h4')];
  hs.forEach(h => {
    let id = norm(h.textContent).replace(/[^a-z0-9]+/g, '-').replace(/^-|-\$/g, '') || 'seccion';
    let n = id, k = 1; while (used.has(n)) n = id + '-' + (++k);
    used.add(n); h.id = n;
  });
  const items = hs.filter(h => /H[23]/.test(h.tagName));
  const toc = \$('#toc');
  if (items.length < 3) { toc.remove(); return; }
  toc.innerHTML = '<b>En esta página</b>' + items.map(h =>
    `<a class="${h.tagName === 'H3' ? 'l3' : ''}" href="#${h.id}">${esc(h.textContent)}</a>`).join('');
  toc.querySelectorAll('a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); document.getElementById(a.getAttribute('href').slice(1)).scrollIntoView();
  }));
  const links = [...toc.querySelectorAll('a')];
  spy = items.map((h, i) => [h, links[i]]);
}

/* ---------- Rutas y eventos ---------- */
function route() {
  searchSeq++; state.cur = null; spy = null;
  document.body.classList.remove('open');
  let h = '';
  try { h = decodeURIComponent(location.hash.replace(/^#\/?/, '')); } catch {}
  if (!h) return home();
  if (state.byPath.has(h)) return fileView(state.byPath.get(h));
  if (state.bySubj.has(h)) return subjectView(state.bySubj.get(h));
  main.innerHTML = `<div class="empty">No se encontró esa página. <a href="#/">Volver al inicio</a></div>`;
}

let timer;
q.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => { const v = q.value.trim(); v ? searchView(v) : route(); }, 120);
});
addEventListener('hashchange', () => { q.value = ''; route(); });
addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; q.blur(); route(); }
});
const menuBtn = \$('#menuBtn');
const isMobile = () => matchMedia('(max-width:860px)').matches;
function syncMenuBtn() {
  const hidden = isMobile() ? !document.body.classList.contains('open') : document.body.classList.contains('noside');
  menuBtn.setAttribute('aria-expanded', String(!hidden));
  menuBtn.title = hidden ? 'Mostrar índice' : 'Ocultar índice';
  menuBtn.setAttribute('aria-label', menuBtn.title);
}
function toggleSide() {
  if (isMobile()) document.body.classList.toggle('open');
  else {
    const on = document.body.classList.toggle('noside');
    try { localStorage.setItem('rv-noside', on ? '1' : '0'); } catch {}
  }
  syncMenuBtn();
}
try { if (localStorage.getItem('rv-noside') === '1') document.body.classList.add('noside'); } catch {}
menuBtn.onclick = toggleSide;
addEventListener('resize', syncMenuBtn);
addEventListener('hashchange', syncMenuBtn);
addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'b' && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) toggleSide();
});
syncMenuBtn();
\$('#scrim').onclick = () => { document.body.classList.remove('open'); syncMenuBtn(); };

let fs = 16;
try { fs = Math.min(24, Math.max(13, parseInt(localStorage.getItem('rv-fs')) || 16)); } catch {}
document.documentElement.style.setProperty('--fs', fs + 'px');
function setFs(n) {
  fs = Math.min(24, Math.max(13, n));
  document.documentElement.style.setProperty('--fs', fs + 'px');
  try { localStorage.setItem('rv-fs', String(fs)); } catch {}
}
const prog = \$('#prog');
const up = \$('#up');
up.onclick = () => scrollTo({ top: 0, behavior: 'smooth' });
let spy = null;
function updateProgress() {
  up.classList.toggle('show', scrollY > 600);
  if (!\$('#md')) { prog.style.width = '0'; return; }
  const max = document.documentElement.scrollHeight - innerHeight;
  prog.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + '%';
  if (spy) {
    let cur = null;
    for (const [h, a] of spy) { if (h.getBoundingClientRect().top <= 110) cur = a; else break; }
    for (const [, a] of spy) a.classList.toggle('act', a === cur);
  }
}
let posT;
function savePos() {
  const cur = state.cur;
  if (!cur || !\$('#md')) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  try {
    const m = JSON.parse(localStorage.getItem('rv-pos') || '{}');
    if (max > 0 && scrollY > 200 && scrollY < max * 0.95) m[cur] = Math.round(scrollY); else delete m[cur];
    const keys = Object.keys(m); if (keys.length > 60) delete m[keys[0]];
    localStorage.setItem('rv-pos', JSON.stringify(m));
  } catch {}
}
addEventListener('scroll', () => { clearTimeout(posT); posT = setTimeout(savePos, 300); }, { passive: true });
addEventListener('scroll', updateProgress, { passive: true });
addEventListener('hashchange', () => setTimeout(updateProgress, 0));
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const a = document.querySelector(e.key === 'ArrowRight' ? '.pn a.nx' : '.pn a:not(.nx)');
  if (a) { e.preventDefault(); location.hash = a.getAttribute('href'); }
});

document.addEventListener('DOMContentLoaded', async () => {
  \$('#siteTitle').textContent = CFG.titulo;
  \$('#ghTop').href = REPO;
  try {
    build(await loadTree());
  } catch (e) {
    state.offline = true;
    setSubjects(CFG.orden.map(k => ({ key: k, files: [] })));
  }
  renderSide();
  route();
});
